name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify tag matches package.json version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Pack release artifacts
        run: |
          pnpm pack --pack-destination artifacts
          cp artifacts/dsh-grok-auth-*.tgz artifacts/dsh-grok-auth-latest.tgz
      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          {
            echo ""
            echo "## Install in DeepSeek Harness Desktop / 安装到桌面端"
            echo ""
            echo "Open Plugins → Add plugin. Set the installation source to the official npm registry, paste the following URL into Package name or address, then install and enable the plugin."
            echo ""
            echo "打开 插件 → 添加插件，安装源选择 npm 官方源，将下面链接粘贴到 包名或地址，安装后立即启用。"
            echo ""
            echo '```text'
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/dsh-grok-auth-${VERSION}.tgz"
            echo '```'
            echo ""
            echo "The package is prebuilt; no local build or build-script permission is needed. When upgrading an existing installation, uninstall it first, install the new package, then quit and reopen DeepSeek Harness."
            echo ""
            echo "安装包已预构建，无需本机编译或构建脚本权限。升级已有安装时，先卸载再安装，并退出、重新打开 DeepSeek Harness。"
          } >> release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.tgz \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
